<style>
*{box-sizing:border-box}

/* GEOGRAFIA REAL — VILLA PELÓN REFORMULADA
   Jerarquía espacial:
   CENTRO = pueblo urbano
   ALREDEDOR = chacras + bodegas
   MÁS LEJOS = río
   MÁS LEJOS TODAVÍA = bardas
   PUNTA REMOTA = Picada 21
   RUTA = conecta Picada 21 con el núcleo urbano
*/
.mountain-range{position:absolute;z-index:3;pointer-events:none;overflow:hidden}

/* BARDAS — perímetro lejano, no protagonista */
.mountain-n{left:0;top:180px;width:8200px;height:720px;
 background:linear-gradient(180deg,rgba(194,159,110,.25),rgba(102,73,48,.58));
 clip-path:polygon(0 62%,6% 52%,12% 60%,18% 43%,24% 56%,30% 38%,36% 52%,42% 34%,48% 50%,54% 31%,60% 48%,66% 36%,72% 53%,78% 33%,84% 49%,90% 37%,96% 51%,100% 42%,100% 100%,0 100%);
 filter:saturate(.62)}
.mountain-n:before{content:"";position:absolute;inset:0;background:linear-gradient(165deg,transparent 0 25%,rgba(226,202,162,.25) 26% 29%,transparent 30% 58%,rgba(65,48,38,.25) 59% 64%,transparent 65%)}

.mountain-s{left:0;top:7420px;width:8200px;height:580px;

 clip-path:polygon(0 72%,9% 58%,18% 69%,27% 52%,36% 66%,45% 48%,54% 64%,63% 51%,72% 67%,81% 49%,90% 64%,100% 53%,100% 100%,0 100%)}

/* RÍO — lejano al pueblo, transversal al mundo */
.river{position:absolute;z-index:4;left:0;top:6250px;width:8200px;height:700px;
 pointer-events:none;background:#587b79;opacity:.94;
 clip-path:polygon(0 46%,8% 39%,16% 47%,24% 34%,32% 44%,40% 31%,48% 42%,56% 29%,64% 40%,72% 26%,80% 38%,88% 25%,100% 34%,
 100% 62%,92% 55%,84% 66%,76% 57%,68% 70%,60% 60%,52% 73%,44% 63%,36% 75%,28% 65%,20% 77%,12% 68%,4% 79%,0 70%)}
.river:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(-7deg,transparent 0 80px,rgba(220,229,215,.20) 82px 88px,transparent 90px 185px)}
.river:after{content:"";position:absolute;left:0;right:0;top:49%;height:9px;background:rgba(224,231,217,.27);filter:blur(2px)}

/* RUTA 65 — une el asentamiento remoto con el pueblo */

 background:repeating-linear-gradient(151deg,transparent 0 150px,rgba(235,222,195,.86) 151px 170px,transparent 171px 320px);
 clip-path:polygon(83.8% 0,84.5% 0,54% 47%,44% 61%,33% 74%,26% 83%,20% 91%,17.5% 100%,17% 100%,18.5% 91%,25.5% 82%,32.5% 73%,43.5% 60%,53.5% 46%,82.4% 0);opacity:.8}

/* PUEBLO — núcleo central */

radial-gradient(ellipse at 18% 30%,rgba(255,226,177,.13),transparent 28%),
radial-gradient(ellipse at 78% 62%,rgba(72,59,42,.09),transparent 31%),
radial-gradient(ellipse at 47% 82%,rgba(236,208,157,.10),transparent 24%);
mix-blend-mode:multiply}
.mountain-n:after,.mountain-s:after{content:"";position:absolute;inset:0;background:

opacity:.65}

.riverbank.n{top:6100px}.riverbank.s{top:6900px;transform:scaleY(-1)}
.route-65:before{background:
linear-gradient(90deg,#77664f,#8b7658 48%,#76634d);
box-shadow:0 0 35px rgba(61,49,37,.2)}
.route-65:after{background:repeating-linear-gradient(151deg,transparent 0 150px,rgba(241,229,204,.82) 151px 164px,transparent 165px 320px)}
.route-junction{position:absolute;z-index:8;left:3900px;top:4300px;width:420px;height:420px;pointer-events:none}

.urban-street{position:absolute;z-index:10;background:rgba(105,91,70,.78);box-shadow:0 3px 0 rgba(221,203,169,.18)}
.us1{left:3220px;top:3890px;width:1880px;height:46px;transform:rotate(-4deg)}
.us2{left:3980px;top:3290px;width:48px;height:1450px;transform:rotate(7deg)}

.ub1{left:3370px;top:3370px}.ub2{left:4270px;top:3430px}.ub3{left:3510px;top:3980px}.ub4{left:4440px;top:4020px}.ub5{left:3620px;top:4550px}.ub6{left:4560px;top:4500px}
.urban-block:after{content:"";position:absolute;left:24px;right:24px;top:26px;height:18px;background:rgba(226,211,181,.42);box-shadow:0 36px rgba(226,211,181,.28)}

.t1{left:3730px;top:3680px}.t2{left:4260px;top:3670px}.t3{left:3700px;top:4110px}.t4{left:4320px;top:4160px}.t5{left:3990px;top:3650px}
.farm:before{content:"";position:absolute;inset:55px 45px;background:repeating-linear-gradient(8deg,rgba(89,105,54,.28) 0 12px,transparent 12px 47px);opacity:.9}

.i1{left:1350px;top:3420px;width:1450px;transform:rotate(4deg)}.i2{left:5200px;top:3150px;width:1300px;transform:rotate(-3deg)}
.i3{left:1450px;top:5480px;width:1550px;transform:rotate(-2deg)}.i4{left:5200px;top:5600px;width:1250px;transform:rotate(4deg)}
.winery{box-shadow:0 12px 0 rgba(61,48,37,.16),0 0 0 26px rgba(99,113,65,.07)}
.winery:before{content:"";position:absolute;left:42px;right:42px;bottom:22px;height:55px;background:rgba(48,42,35,.35);border-radius:50% 50% 5px 5px}
.winery:after{top:-78px;height:48px;background:repeating-linear-gradient(90deg,rgba(91,105,57,.42) 0 12px,transparent 12px 32px)}
.vineyard{position:absolute;z-index:7;width:520px;height:260px;pointer-events:none;opacity:.48;background:repeating-linear-gradient(90deg,transparent 0 30px,rgba(83,101,54,.75) 31px 39px,transparent 40px 76px)}
.v1{left:1550px;top:3200px;transform:rotate(-4deg)}.v2{left:5450px;top:3150px;transform:rotate(5deg)}.v3{left:1650px;top:5000px;transform:rotate(3deg)}.v4{left:5050px;top:4850px;transform:rotate(-5deg)}
.picada-path{position:absolute;z-index:6;left:6500px;top:1050px;width:720px;height:18px;background:#857255;transform:rotate(18deg);transform-origin:left center;opacity:.85}

<body>
<div id="planLegend">PLANEAMIENTO · A1–A4 / D1–D4 <span class="sw" style="background:#c7a875"></span>baja <span class="sw" style="background:#62452e"></span>muy alta</div><main id="game">
<div class="viewport" id="viewport">
<div class="world" id="world">
<div id="planningGrid" aria-hidden="true"></div>
<div class="terrain"></div>
<!-- MOTOR GEOGRAFICO REAL · escala mundial 8200x8200 -->
<div class="mountain-range mountain-n" aria-label="Barda y montañas del norte"></div>
<div class="mountain-range mountain-s" aria-label="Barda y montañas del sur"></div>
<div class="river" aria-label="Río del sector D1-D4"></div>
<div class="route route-65" aria-label="Ruta 65"></div>
<div class="town" aria-label="Villa Pelón · sector urbano"></div><div class="farm f1"></div><div class="farm f2"></div><div class="farm f3"></div><div class="farm f4"></div><div class="farm f5"></div><div class="farm f6"></div><div class="winery w1"></div><div class="winery w2"></div><div class="winery w3"></div><div class="winery w4"></div>
<div class="settlement" aria-label="Asentamientos de Picada 21"></div>
<div class="riverbank n"></div><div class="riverbank s"></div>
<div class="route-junction"></div>
<div class="irrigation i1"></div><div class="irrigation i2"></div><div class="irrigation i3"></div><div class="irrigation i4"></div>
<div class="vineyard v1"></div><div class="vineyard v2"></div><div class="vineyard v3"></div><div class="vineyard v4"></div>
<div class="urban-street us1"></div><div class="urban-street us2"></div><div class="urban-street us3"></div><div class="urban-street us4"></div>
<div class="urban-block ub1"></div><div class="urban-block ub2"></div><div class="urban-block ub3"></div><div class="urban-block ub4"></div><div class="urban-block ub5"></div><div class="urban-block ub6"></div>
<div class="plaza"></div><div class="tree t1"></div><div class="tree t2"></div><div class="tree t3"></div><div class="tree t4"></div><div class="tree t5"></div>
<div class="picada-path"></div><div class="picada-home"></div><div class="picada-tree"></div>
<div class="atmosphere"></div>
<!-- CAPA DE PLANEAMIENTO TEMPORAL -->
<div class="planned-line plan-mountain-n"></div><div class="planned-line plan-mountain-s"></div><div class="planned-line plan-route65"></div><div class="plan-town"></div><div class="plan-picada"></div>
<div class="scrub s1"></div><div class="scrub s2"></div><div class="scrub s3"></div>
<div class="scrub s4"></div><div class="scrub s5"></div><div class="scrub s6"></div>
<div class="scrub s7"></div><div class="scrub s8"></div><div class="scrub s9"></div>
<div class="stones st1"></div><div class="stones st2"></div><div class="stones st3"></div>
<div class="stones st4"></div><div class="stones st5"></div>
<div class="wind"></div><div class="border"></div>
</div>
</div>
</main>
<script>
const viewport=document.getElementById('viewport'),world=document.getElementById('world');
let scale=.16,x=4100,y=4100,drag=false,lx=0,ly=0;
const clamp=v=>Math.max(0,Math.min(8200,v));
function render(){
 const tx=innerWidth/2-x*scale,ty=innerHeight/2-y*scale;
 world.style.transform='translate3d('+tx+'px,'+ty+'px,0) scale('+scale+')';
}
function move(dx,dy){x=clamp(x+dx);y=clamp(y+dy);render()}
addEventListener('keydown',e=>{
 const k=e.key.toLowerCase();
 if(k==='w'||k==='arrowup')move(0,-90);
 if(k==='s'||k==='arrowdown')move(0,90);
 if(k==='a'||k==='arrowleft')move(-90,0);
 if(k==='d'||k==='arrowright')move(90,0);
});
viewport.addEventListener('pointerdown',e=>{drag=true;lx=e.clientX;ly=e.clientY;viewport.setPointerCapture(e.pointerId)});
viewport.addEventListener('pointermove',e=>{
 if(!drag)return;
 x=clamp(x-(e.clientX-lx)/scale);y=clamp(y-(e.clientY-ly)/scale);
 lx=e.clientX;ly=e.clientY;render();
});
viewport.addEventListener('pointerup',()=>drag=false);
viewport.addEventListener('pointercancel',()=>drag=false);
addEventListener('resize',render);
render();

const planLegend=document.getElementById('planLegend');
let planningMode=false;
function togglePlanning(){planningMode=!planningMode;planLegend.style.display=planningMode?'block':'none';document.getElementById('planningGrid').style.display=planningMode?'block':'none';}
addEventListener('keydown',e=>{if(e.key.toLowerCase()==='g')togglePlanning()});

function syncPlanningLayers(){const on=planningMode;document.querySelectorAll('.planned-line,.plan-town,.plan-picada').forEach(e=>e.style.display=on?'block':'none');document.querySelectorAll('.mountain-range,.river,.route,.town,.settlement').forEach(e=>e.style.visibility='visible')}
const oldToggle=togglePlanning;togglePlanning=function(){oldToggle();syncPlanningLayers()};syncPlanningLayers();</script>
</body>
</html>
