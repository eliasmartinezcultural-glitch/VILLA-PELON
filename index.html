<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Villa Pelón · Territorio</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#b49b70}
#game{position:relative;width:100%;height:100%;overflow:hidden;background:#b49b70}
.viewport{position:absolute;inset:0;overflow:hidden;touch-action:none;cursor:grab}
.viewport:active{cursor:grabbing}
.world{position:absolute;width:8200px;height:8200px;left:0;top:0;overflow:hidden;transform-origin:0 0}
.terrain{
 position:absolute;inset:0;
 background:
 repeating-radial-gradient(ellipse at 30% 40%,transparent 0 130px,rgba(86,70,45,.08) 132px 136px,transparent 138px 260px),
 repeating-linear-gradient(17deg,transparent 0 180px,rgba(77,66,47,.045) 181px 186px,transparent 187px 370px);
}
.scrub{
 position:absolute;width:260px;height:130px;border-radius:55% 45% 50% 50%;
 background:#65704b;opacity:.78;
 box-shadow:80px 8px #747b50,150px -10px #586445,-65px 18px #727951;
}
.s1{left:900px;top:1200px}.s2{left:2600px;top:1900px}.s3{left:5000px;top:1100px}
.s4{left:1500px;top:4200px}.s5{left:3800px;top:5200px}.s6{left:6200px;top:3900px}
.s7{left:700px;top:6700px}.s8{left:3000px;top:7200px}.s9{left:5600px;top:6500px}
.stones{
 position:absolute;width:180px;height:110px;border-radius:50%;
 background:radial-gradient(ellipse at 35% 35%,#9a8a68,#6e604b);opacity:.7;
}
.st1{left:1800px;top:3000px}.st2{left:4500px;top:3500px}.st3{left:3000px;top:6100px}
.st4{left:6800px;top:2500px}.st5{left:700px;top:5200px}
.wind{
 position:absolute;left:0;top:0;width:8200px;height:8200px;opacity:.14;
 background:repeating-linear-gradient(-8deg,transparent 0 480px,rgba(255,241,198,.7) 481px 488px,transparent 489px 900px);
}
.border{position:absolute;left:0;top:0;width:8200px;height:8200px;border:0;pointer-events:none}
#planningGrid{display:none;position:absolute;inset:0;width:8200px;height:8200px;pointer-events:none;
 background-image:linear-gradient(to right,rgba(35,30,20,.22) 1px,transparent 1px),linear-gradient(to bottom,rgba(35,30,20,.22) 1px,transparent 1px);
 background-size:2050px 2050px}
#planningGrid::after{content:"A1       A2       A3       A4\A\A\A B1       B2       B3       B4\A\A\A C1       C2       C3       C4\A\A\A D1       D2       D3       D4";white-space:pre;position:absolute;inset:0;padding:80px;font:700 90px/1050px Arial,sans-serif;letter-spacing:8px;color:rgba(30,25,18,.45);text-align:center}

#planLegend{display:none;position:fixed;z-index:20;left:12px;top:12px;padding:10px 12px;border-radius:10px;background:rgba(25,22,18,.78);color:#f4ead7;font:600 13px/1.5 Arial,sans-serif;pointer-events:none}
#planLegend .sw{display:inline-block;width:14px;height:14px;margin:0 5px 0 10px;vertical-align:-2px;border-radius:3px}
.planned-line{position:absolute;pointer-events:none}.plan-route65{left:39%;top:0;width:32%;height:100%;border-left:18px solid rgba(100,78,54,.72);transform:rotate(8deg);transform-origin:center}.plan-town{position:absolute;left:25%;top:38%;width:25%;height:18%;border:12px dashed rgba(75,65,48,.65);background:rgba(130,115,80,.12)}.plan-picada{position:absolute;left:76%;top:2%;width:20%;height:22%;border:10px dotted rgba(85,70,45,.55)}.plan-mountain-n{position:absolute;left:5%;top:10%;width:90%;height:14%;background:linear-gradient(90deg,rgba(199,168,119,.28),rgba(92,64,43,.48),rgba(199,168,119,.24));clip-path:polygon(0 70%,12% 48%,24% 65%,37% 25%,50% 58%,63% 18%,76% 54%,88% 35%,100% 65%,100% 100%,0 100%)}.plan-mountain-s{position:absolute;left:8%;top:77%;width:84%;height:11%;background:linear-gradient(90deg,rgba(199,168,119,.22),rgba(92,64,43,.34),rgba(199,168,119,.2));clip-path:polygon(0 75%,18% 48%,33% 70%,49% 35%,64% 68%,80% 45%,100% 72%,100% 100%,0 100%)}
/* GEOGRAFIA REAL — convertida desde el planeamiento a motor */
.mountain-range{position:absolute;z-index:3;pointer-events:none;overflow:hidden}

/* BARDA NORTE — formación de meseta/barda, continua A1→A4 */
.mountain-n{left:0;top:650px;width:8200px;height:1120px;
 background:
 linear-gradient(180deg,rgba(218,191,148,.42) 0%,rgba(184,148,103,.25) 22%,rgba(111,78,51,.48) 64%,rgba(74,53,39,.62) 100%);
 clip-path:polygon(0 69%,4% 60%,8% 63%,12% 50%,16% 58%,20% 42%,24% 55%,28% 36%,32% 48%,36% 31%,40% 51%,44% 38%,48% 56%,52% 29%,56% 45%,60% 34%,64% 53%,68% 27%,72% 47%,76% 33%,80% 52%,84% 29%,88% 43%,92% 34%,96% 48%,100% 39%,100% 100%,0 100%);
 filter:saturate(.65);
 box-shadow:inset 0 -150px 180px rgba(54,40,31,.25)}
.mountain-n:before{content:"";position:absolute;inset:0;
 background:
 linear-gradient(164deg,transparent 0 10%,rgba(238,216,178,.42) 10.5% 12%,transparent 12.5% 28%,rgba(71,51,38,.34) 29% 34%,transparent 34.5% 49%,rgba(221,194,153,.27) 49.5% 52%,transparent 52.5% 69%,rgba(65,48,37,.28) 70% 75%,transparent 75.5%);
 opacity:.9}
.mountain-n:after{content:"";position:absolute;left:0;right:0;bottom:0;height:380px;
 background:linear-gradient(180deg,transparent,rgba(56,42,32,.38));
 clip-path:polygon(0 55%,10% 39%,20% 58%,30% 32%,40% 54%,50% 28%,60% 57%,70% 35%,80% 53%,90% 31%,100% 48%,100% 100%,0 100%)}

/* BARDA SUR — D1→D4, relieve menor */
.mountain-s{left:0;top:7040px;width:8200px;height:430px;
 background:linear-gradient(180deg,rgba(183,148,103,.18),rgba(92,68,49,.36));
 clip-path:polygon(0 76%,7% 63%,14% 70%,21% 55%,28% 68%,35% 57%,42% 72%,49% 52%,56% 67%,63% 55%,70% 70%,77% 51%,84% 66%,91% 54%,100% 64%,100% 100%,0 100%);
 filter:saturate(.65)}
.mountain-s:before{content:"";position:absolute;inset:0;
 background:linear-gradient(165deg,transparent 0 25%,rgba(218,193,153,.22) 26% 29%,transparent 30% 58%,rgba(67,50,39,.24) 59% 64%,transparent 65%)}

/* RÍO — cauce único, sinuoso y continuo de borde a borde en D1→D4 */
.river{position:absolute;z-index:5;left:0;top:5960px;width:8200px;height:1050px;
 pointer-events:none;background:#547876;opacity:.96;
 clip-path:polygon(0 50%,5% 44%,10% 49%,15% 39%,20% 45%,25% 34%,30% 42%,35% 30%,40% 38%,45% 25%,50% 34%,55% 22%,60% 31%,65% 19%,70% 28%,75% 16%,80% 25%,85% 14%,90% 22%,95% 12%,100% 19%,
 100% 47%,95% 43%,90% 54%,85% 47%,80% 58%,75% 50%,70% 62%,65% 54%,60% 68%,55% 59%,50% 72%,45% 63%,40% 76%,35% 67%,30% 79%,25% 70%,20% 82%,15% 73%,10% 84%,5% 76%,0 88%)}
.river:before{content:"";position:absolute;inset:0;
 background:
 repeating-linear-gradient(-8deg,transparent 0 82px,rgba(219,227,213,.20) 84px 90px,transparent 92px 185px),
 linear-gradient(180deg,rgba(28,57,56,.24),transparent 35%,rgba(24,49,49,.18) 78%,rgba(214,222,207,.10));
}
.river:after{content:"";position:absolute;left:0;right:0;top:51%;height:10px;
 background:rgba(225,231,216,.30);filter:blur(2px)}

/* RUTA 65 — diagonal D1→A4, borde a borde */
.route{position:absolute;z-index:7;left:0;top:0;width:8200px;height:8200px;pointer-events:none}
.route-65:before{content:"";position:absolute;inset:0;background:#78664e;
 clip-path:polygon(8% 100%,10.1% 100%,88.2% 0,90.3% 0);
 filter:drop-shadow(0 7px 12px rgba(48,39,30,.32))}
.route-65:after{content:"";position:absolute;inset:0;
 background:repeating-linear-gradient(155deg,transparent 0 145px,rgba(233,221,195,.88) 146px 166px,transparent 167px 310px);
 clip-path:polygon(8.9% 100%,9.7% 100%,89% 0,89.8% 0);opacity:.82}

.town{position:absolute;z-index:8;left:2050px;top:4100px;width:2050px;height:1250px;
 border-radius:22%;background:
 radial-gradient(circle at 18% 25%,rgba(104,82,60,.78) 0 20px,transparent 22px),
 radial-gradient(circle at 31% 55%,rgba(104,82,60,.62) 0 18px,transparent 20px),
 radial-gradient(circle at 46% 36%,rgba(104,82,60,.70) 0 24px,transparent 26px),
 radial-gradient(circle at 63% 60%,rgba(104,82,60,.68) 0 21px,transparent 23px),
 radial-gradient(circle at 78% 30%,rgba(104,82,60,.72) 0 18px,transparent 20px),
 radial-gradient(circle at 84% 72%,rgba(104,82,60,.58) 0 20px,transparent 22px),
 rgba(126,108,78,.11);pointer-events:none}
.town:before,.town:after{content:"";position:absolute;background:rgba(94,78,59,.55)}
.town:before{left:8%;right:7%;top:52%;height:32px;transform:rotate(-6deg)}
.town:after{top:9%;bottom:8%;left:52%;width:30px;transform:rotate(8deg)}

.settlement{position:absolute;z-index:8;left:6250px;top:300px;width:1450px;height:1500px;pointer-events:none;
 background:
 radial-gradient(circle at 12% 20%,#806546 0 20px,transparent 23px),
 radial-gradient(circle at 28% 42%,#91724d 0 17px,transparent 20px),
 radial-gradient(circle at 45% 26%,#72573d 0 23px,transparent 26px),
 radial-gradient(circle at 63% 48%,#8d6d49 0 19px,transparent 22px),
 radial-gradient(circle at 78% 30%,#796043 0 16px,transparent 19px),
 radial-gradient(circle at 52% 72%,#806546 0 18px,transparent 21px),
 radial-gradient(circle at 25% 76%,#8d6d49 0 15px,transparent 18px)}

/* BORDES GEOGRÁFICOS: nada puede salir del mundo 8200×8200 */
.border{z-index:20}
</style>
</head>
<body>
<div id="planLegend">PLANEAMIENTO · A1–A4 / D1–D4 <span class="sw" style="background:#c7a875"></span>baja <span class="sw" style="background:#62452e"></span>muy alta</div><main id="game">
<div class="viewport" id="viewport">
<div class="world" id="world">
<div id="planningGrid" aria-hidden="true"></div>
<div class="terrain"></div>
<!-- MOTOR GEOGRAFICO REAL · escala mundial 8200x8200 -->
<div class="mountain-range mountain-n" aria-label="Barda y montañas del norte"></div>
<div class="mountain-range mountain-s" aria-label="Barda y montañas del sur"></div>
<div class="river" aria-label="Río del sector D1-D4"></div>
<div class="route route-65" aria-label="Ruta 65"></div>
<div class="town" aria-label="Pueblo urbano"></div>
<div class="settlement" aria-label="Asentamientos de Picada 21"></div>
<!-- CAPA DE PLANEAMIENTO TEMPORAL -->
<div class="planned-line plan-mountain-n"></div><div class="planned-line plan-mountain-s"></div><div class="planned-line plan-route65"></div><div class="plan-town"></div><div class="plan-picada"></div>
<div class="scrub s1"></div><div class="scrub s2"></div><div class="scrub s3"></div>
<div class="scrub s4"></div><div class="scrub s5"></div><div class="scrub s6"></div>
<div class="scrub s7"></div><div class="scrub s8"></div><div class="scrub s9"></div>
<div class="stones st1"></div><div class="stones st2"></div><div class="stones st3"></div>
<div class="stones st4"></div><div class="stones st5"></div>
<div class="wind"></div><div class="border"></div>
</div>
</div>
</main>
<script>
const viewport=document.getElementById('viewport'),world=document.getElementById('world');
let scale=.16,x=4100,y=4100,drag=false,lx=0,ly=0;
const clamp=v=>Math.max(0,Math.min(8200,v));
function render(){
 const tx=innerWidth/2-x*scale,ty=innerHeight/2-y*scale;
 world.style.transform='translate3d('+tx+'px,'+ty+'px,0) scale('+scale+')';
}
function move(dx,dy){x=clamp(x+dx);y=clamp(y+dy);render()}
addEventListener('keydown',e=>{
 const k=e.key.toLowerCase();
 if(k==='w'||k==='arrowup')move(0,-90);
 if(k==='s'||k==='arrowdown')move(0,90);
 if(k==='a'||k==='arrowleft')move(-90,0);
 if(k==='d'||k==='arrowright')move(90,0);
});
viewport.addEventListener('pointerdown',e=>{drag=true;lx=e.clientX;ly=e.clientY;viewport.setPointerCapture(e.pointerId)});
viewport.addEventListener('pointermove',e=>{
 if(!drag)return;
 x=clamp(x-(e.clientX-lx)/scale);y=clamp(y-(e.clientY-ly)/scale);
 lx=e.clientX;ly=e.clientY;render();
});
viewport.addEventListener('pointerup',()=>drag=false);
viewport.addEventListener('pointercancel',()=>drag=false);
addEventListener('resize',render);
render();

const planLegend=document.getElementById('planLegend');
let planningMode=false;
function togglePlanning(){planningMode=!planningMode;planLegend.style.display=planningMode?'block':'none';document.getElementById('planningGrid').style.display=planningMode?'block':'none';}
addEventListener('keydown',e=>{if(e.key.toLowerCase()==='g')togglePlanning()});

function syncPlanningLayers(){const on=planningMode;document.querySelectorAll('.planned-line,.plan-town,.plan-picada').forEach(e=>e.style.display=on?'block':'none');document.querySelectorAll('.mountain-range,.river,.route,.town,.settlement').forEach(e=>e.style.visibility='visible')}
const oldToggle=togglePlanning;togglePlanning=function(){oldToggle();syncPlanningLayers()};syncPlanningLayers();</script>
</body>
</html>
