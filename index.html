<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Luna en Villa Pelón · Nuevo motor</title>
<style>
:root{
  --ink:#2d2922;--paper:#efe4ce;--sand:#b89a6b;--road:#75644e;
  --green:#647052;--night:#1e2630;--accent:#d7a85e;
}
*{box-sizing:border-box}
html,body,#game{margin:0;width:100%;height:100%;overflow:hidden}
body{background:#171716;font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:var(--ink)}
#game{position:relative;background:#9e875f}
.viewport{position:absolute;inset:0;overflow:hidden;touch-action:none}
.world{
  position:absolute;left:0;top:0;width:12000px;height:12000px;
  transform-origin:0 0;
  background:#a98d61;
  overflow:hidden;
}
.ground{
  position:absolute;inset:0;
  background:
    radial-gradient(ellipse at 28% 30%,rgba(238,213,165,.18),transparent 28%),
    radial-gradient(ellipse at 72% 70%,rgba(71,59,43,.12),transparent 30%),
    repeating-linear-gradient(14deg,transparent 0 520px,rgba(68,58,43,.035) 523px 532px,transparent 536px 980px);
}
.ground:after{content:"";position:absolute;inset:0;opacity:.28;background-image:radial-gradient(rgba(53,44,34,.28) 1px,transparent 1px);background-size:47px 47px}
.zone{position:absolute;border-radius:32px;pointer-events:none}
.zone-town{left:3900px;top:4050px;width:4200px;height:3300px;background:rgba(153,130,91,.22);border:18px solid rgba(93,76,55,.13)}
.zone-farms{left:2300px;top:2900px;width:7400px;height:6100px;border:20px dashed rgba(91,100,59,.16)}
.zone-river{left:0;top:9000px;width:12000px;height:800px;background:#557978;clip-path:polygon(0 42%,12% 30%,25% 48%,39% 32%,52% 45%,67% 27%,81% 43%,100% 30%,100% 70%,83% 59%,68% 75%,52% 61%,38% 74%,23% 59%,9% 70%,0 61%)}
.zone-river:after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(-8deg,transparent 0 100px,rgba(228,235,218,.18) 103px 114px,transparent 117px 250px)}
.barda{position:absolute;left:0;width:12000px;background:linear-gradient(180deg,rgba(194,159,111,.25),rgba(82,61,45,.48));clip-path:polygon(0 68%,8% 48%,17% 62%,26% 40%,35% 58%,44% 36%,53% 55%,62% 34%,71% 57%,80% 39%,90% 55%,100% 38%,100% 100%,0 100%)}
.barda.n{top:500px;height:950px}.barda.s{top:10800px;height:850px;opacity:.75}
.road{position:absolute;height:150px;background:#76644d;box-shadow:0 12px 25px rgba(42,34,25,.16);border-radius:100px;pointer-events:none}
.road.main{left:2450px;top:6350px;width:8100px;transform:rotate(-10deg)}
.road.route{left:7350px;top:1300px;width:9100px;transform:rotate(62deg);height:190px}
.road.route:after,.road.main:after{content:"";position:absolute;inset:50% 0 auto;height:8px;background:repeating-linear-gradient(90deg,#e9ddbf 0 80px,transparent 80px 170px);opacity:.8}
.town-core{position:absolute;left:4050px;top:4200px;width:3900px;height:3000px;border-radius:18%;background:rgba(126,107,78,.14)}
.block{position:absolute;width:560px;height:360px;border-radius:22px;background:#9a8060;box-shadow:inset 0 -55px rgba(72,57,43,.13),0 16px 0 rgba(61,48,36,.1)}
.street{position:absolute;background:rgba(94,79,61,.68);border-radius:40px}
.plaza{position:absolute;left:5550px;top:5350px;width:850px;height:650px;border-radius:30%;background:#78805e;box-shadow:inset 0 0 0 34px rgba(217,199,158,.25)}
.plaza:after{content:"";position:absolute;left:50%;top:50%;width:150px;height:150px;transform:translate(-50%,-50%);border-radius:50%;background:#a78b61}
.field{position:absolute;border:10px solid rgba(91,100,59,.17);background:repeating-linear-gradient(7deg,rgba(91,105,58,.20) 0 45px,transparent 46px 100px);transform:rotate(-3deg)}
.f1{left:1900px;top:2700px;width:2400px;height:1500px}.f2{left:7800px;top:2800px;width:2600px;height:1600px}
.f3{left:1900px;top:7500px;width:2300px;height:1700px}.f4{left:8200px;top:7200px;width:2500px;height:1600px}
.vineyard{position:absolute;width:1300px;height:850px;background:repeating-linear-gradient(90deg,rgba(76,91,47,.38) 0 18px,transparent 18px 58px);transform:rotate(-3deg);opacity:.85}
.v1{left:3000px;top:2700px}.v2{left:8500px;top:4700px}.v3{left:3600px;top:7800px}
.building{position:absolute;width:520px;height:360px;background:#795f48;border:28px solid #604d3c;border-radius:20px;box-shadow:0 18px 0 rgba(56,44,34,.13)}
.w1{left:3850px;top:3150px}.w2{left:9000px;top:4850px}.w3{left:4150px;top:8100px}
.picada{position:absolute;left:10100px;top:1000px;width:1300px;height:1200px;border-radius:50%;background:rgba(125,104,72,.15)}
.picada .hut{position:absolute;width:190px;height:140px;background:#826a4d;border:14px solid #614c39;border-radius:14px}
.h1{left:240px;top:250px}.h2{left:650px;top:500px}.h3{left:450px;top:800px}
.tree{position:absolute;width:95px;height:95px;border-radius:50%;background:#596548;box-shadow:40px 18px #687253,-30px 28px #697351;opacity:.9}
.t1{left:4850px;top:4500px}.t2{left:7400px;top:6100px}.t3{left:6500px;top:4750px}.t4{left:5200px;top:6900px}.t5{left:7850px;top:5200px}
.actor{position:absolute;z-index:30;width:100px;height:120px;transform:translate(-50%,-50%);pointer-events:none}
.actor .head{position:absolute;left:28px;top:0;width:44px;height:44px;border-radius:50%;background:#c89068;border:6px solid #44382f}
.actor .body{position:absolute;left:18px;top:42px;width:64px;height:62px;border-radius:20px 20px 14px 14px;background:#456274;border:6px solid #44382f}
.actor .leg{position:absolute;top:96px;width:22px;height:30px;background:#3e4145;border-radius:8px}
.actor .l{left:25px}.actor .r{right:25px}
.actor.luna .body{background:#d49c55}.actor.luna .head:after{content:"";position:absolute;left:-9px;top:-9px;width:58px;height:22px;border-radius:50%;background:#6f5037;z-index:-1}
.actor .name{position:absolute;top:-42px;left:50%;transform:translateX(-50%);padding:7px 12px;border-radius:14px;background:rgba(35,30,25,.78);color:#fff8e8;font-size:22px;white-space:nowrap}
.actor.npc .body{background:#6e7a5a}.actor.child{transform:translate(-50%,-50%) scale(.78)}.actor.elder .body{background:#7b5d70}
.vehicle{position:absolute;z-index:25;width:180px;height:95px;border-radius:28px;background:#4f5960;border:12px solid #353a3d;box-shadow:0 14px 18px rgba(40,33,27,.2)}
.vehicle:before,.vehicle:after{content:"";position:absolute;bottom:-28px;width:38px;height:38px;border-radius:50%;background:#292b2d;border:7px solid #555}
.vehicle:before{left:16px}.vehicle:after{right:16px}
.dialogue{position:fixed;z-index:100;left:50%;bottom:28px;transform:translateX(-50%);width:min(760px,calc(100% - 28px));padding:22px 24px;border-radius:24px;background:rgba(29,26,22,.94);color:#f5ead5;box-shadow:0 18px 60px rgba(0,0,0,.3);display:none}
.dialogue.show{display:block}.dialogue strong{display:block;color:#e5bb70;font-size:18px;margin-bottom:8px}.dialogue p{margin:0;font-size:18px;line-height:1.45}.dialogue button{margin-top:15px;border:0;border-radius:14px;padding:10px 16px;background:#d7a85e;color:#2d251c;font-weight:800}
.hud{position:fixed;z-index:90;left:18px;top:18px;padding:12px 16px;border-radius:18px;background:rgba(28,25,21,.72);color:#fff4df;backdrop-filter:blur(8px);font-size:14px}
.hud b{color:#e5bb70}.hint{position:fixed;z-index:90;right:18px;bottom:18px;padding:10px 14px;border-radius:15px;background:rgba(28,25,21,.68);color:#fff4df;font-size:13px}
#vignette{position:fixed;z-index:80;inset:0;pointer-events:none;background:radial-gradient(circle,transparent 45%,rgba(25,22,18,.18));transition:background 1s}
#touch{position:fixed;z-index:95;right:18px;bottom:64px;display:none;grid-template-columns:repeat(3,54px);gap:6px}
#touch button{width:54px;height:54px;border:0;border-radius:16px;background:rgba(30,27,23,.72);color:#fff;font-size:22px}
#touch .empty{visibility:hidden}
@media(max-width:700px){.hud{font-size:12px}.hint{display:none}#touch{display:grid}.dialogue{bottom:18px}.dialogue p{font-size:16px}}
</style>
</head>
<body>
<div id="game">
  <div class="viewport" id="viewport">
    <div class="world" id="world">
      <div class="ground"></div>
      <div class="barda n"></div><div class="barda s"></div>
      <div class="field f1"></div><div class="field f2"></div><div class="field f3"></div><div class="field f4"></div>
      <div class="vineyard v1"></div><div class="vineyard v2"></div><div class="vineyard v3"></div>
      <div class="zone zone-farms"></div>
      <div class="zone zone-town"></div>
      <div class="town-core"></div>
      <div class="road main"></div><div class="road route"></div>
      <div class="zone zone-river"></div>
      <div class="picada"><div class="hut h1"></div><div class="hut h2"></div><div class="hut h3"></div></div>
      <div class="building w1"></div><div class="building w2"></div><div class="building w3"></div>
      <div class="plaza"></div>
      <div class="block" style="left:4400px;top:4500px"></div><div class="block" style="left:5100px;top:4500px"></div>
      <div class="block" style="left:6500px;top:4500px"></div><div class="block" style="left:7200px;top:4500px"></div>
      <div class="block" style="left:4400px;top:6000px"></div><div class="block" style="left:6500px;top:6000px"></div>
      <div class="street" style="left:4250px;top:5150px;width:3400px;height:100px"></div>
      <div class="street" style="left:4250px;top:6500px;width:3400px;height:100px"></div>
      <div class="street" style="left:5750px;top:4300px;width:100px;height:2500px"></div>
      <div class="street" style="left:7200px;top:4300px;width:100px;height:2500px"></div>
      <div class="tree t1"></div><div class="tree t2"></div><div class="tree t3"></div><div class="tree t4"></div><div class="tree t5"></div>
      <div class="vehicle" id="car1" style="left:8200px;top:5000px"></div>
      <div class="vehicle" id="car2" style="left:9400px;top:3600px"></div>
      <div class="actor luna" id="luna"><div class="head"></div><div class="body"></div><div class="leg l"></div><div class="leg r"></div><span class="name">Luna</span></div>
      <div class="actor npc" data-id="abuela" data-x="6100" data-y="5200"><div class="head"></div><div class="body"></div><div class="leg l"></div><div class="leg r"></div><span class="name">Abuela</span></div>
      <div class="actor npc elder" data-id="abuelo" data-x="6900" data-y="5400"><div class="head"></div><div class="body"></div><div class="leg l"></div><div class="leg r"></div><span class="name">Abuelo</span></div>
      <div class="actor npc" data-id="maestra" data-x="5000" data-y="5700"><div class="head"></div><div class="body"></div><div class="leg l"></div><div class="leg r"></div><span class="name">Maestra</span></div>
      <div class="actor npc child" data-id="nina" data-x="7200" data-y="5800"><div class="head"></div><div class="body"></div><div class="leg l"></div><div class="leg r"></div><span class="name">Nina</span></div>
      <div class="actor npc" data-id="bodeguero" data-x="4300" data-y="3300"><div class="head"></div><div class="body"></div><div class="leg l"></div><div class="leg r"></div><span class="name">Bodeguero</span></div>
    </div>
  </div>
  <div class="hud">Villa Pelón · <b id="clock">08:00</b> · <span id="status">Explorando</span></div>
  <div class="hint">WASD / flechas · acercate a las personas</div>
  <div id="dialogue" class="dialogue"><strong id="speaker"></strong><p id="text"></p><button id="closeDialogue">Continuar</button></div>
  <div id="touch">
    <button class="empty"></button><button data-key="ArrowUp">▲</button><button class="empty"></button>
    <button data-key="ArrowLeft">◀</button><button data-key="ArrowDown">▼</button><button data-key="ArrowRight">▶</button>
  </div>
  <div id="vignette"></div>
</div>
<script>
/* =========================================================
   NUEVO MOTOR · Luna en Villa Pelón
   Principio: motor primero, contenido después.
   Todo el estado importante vive en datos, no en posiciones sueltas.
========================================================= */
const WORLD={w:12000,h:12000};
const player={x:6200,y:5750,speed:105};
const camera={x:6200,y:5750,scale:.15};
const keys=new Set();
let gameMinutes=8*60;
let last=performance.now();
let dialogueOpen=false;

const npcs={
 abuela:{name:"Abuela",x:6100,y:5200,home:[6100,5200],work:[5550,5600],speed:55,dialogue:["Villa Pelón se conoce caminándolo. Cada lugar guarda una historia.","Si querés descubrirla, no mires solamente: preguntá, observá y seguí las pistas."]},
 abuelo:{name:"Abuelo",x:6900,y:5400,home:[6900,5400],work:[6200,6400],speed:48,dialogue:["Hay caminos que parecen comunes hasta que alguien te cuenta por qué están ahí.","La historia del pueblo también está en sus calles, sus chacras y su gente."]},
 maestra:{name:"Maestra",x:5000,y:5700,home:[5000,5700],work:[4700,5550],speed:62,dialogue:["En este pueblo aprender no ocurre solamente dentro de la escuela.","Tu cuaderno va a ir reuniendo tus descubrimientos."]},
 nina:{name:"Nina",x:7200,y:5800,home:[7200,5800],work:[7000,5900],speed:78,dialogue:["¿Venís a explorar? Yo conozco algunos lugares que casi nadie mira."]},
 bodeguero:{name:"Bodeguero",x:4300,y:3300,home:[4300,3300],work:[4120,3300],speed:52,dialogue:["Las chacras y las bodegas forman parte del paisaje productivo de Villa Pelón.","Hay mucho para descubrir alrededor del pueblo."]}
};
const npcEls=[...document.querySelectorAll(".actor.npc")];
const luna=document.getElementById("luna"), world=document.getElementById("world");
const clockEl=document.getElementById("clock"),statusEl=document.getElementById("status");
const dialogue=document.getElementById("dialogue"),speaker=document.getElementById("speaker"),text=document.getElementById("text");

function clamp(v,min,max){return Math.max(min,Math.min(max,v))}
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function schedule(npc){
  const h=gameMinutes/60;
  if(h<9) return npc.home;
  if(h<14) return npc.work;
  if(h<18) return [(npc.home[0]+npc.work[0])/2,(npc.home[1]+npc.work[1])/2];
  return npc.home;
}
function updateNPCs(dt){
  npcEls.forEach(el=>{
    const n=npcs[el.dataset.id]; if(!n)return;
    const target=schedule(n);
    const dx=target[0]-n.x,dy=target[1]-n.y,d=Math.hypot(dx,dy);
    if(d>18){n.x+=dx/d*n.speed*dt;n.y+=dy/d*n.speed*dt}
    el.style.left=n.x+"px";el.style.top=n.y+"px";
  });
}
function nearestNPC(){
  let best=null,bestD=360;
  for(const n of Object.values(npcs)){const d=dist(player,n);if(d<bestD){best=n;bestD=d}}
  return best;
}
function talk(n){
  dialogueOpen=true;
  speaker.textContent=n.name;
  text.textContent=n.dialogue[Math.floor(gameMinutes)%n.dialogue.length];
  dialogue.classList.add("show");
  statusEl.textContent="Conversando";
}
document.getElementById("closeDialogue").onclick=()=>{dialogueOpen=false;dialogue.classList.remove("show");statusEl.textContent="Explorando"};
function movePlayer(dt){
  if(dialogueOpen)return;
  let dx=0,dy=0;
  if(keys.has("ArrowLeft")||keys.has("a"))dx--;
  if(keys.has("ArrowRight")||keys.has("d"))dx++;
  if(keys.has("ArrowUp")||keys.has("w"))dy--;
  if(keys.has("ArrowDown")||keys.has("s"))dy++;
  if(!dx&&!dy)return;
  const len=Math.hypot(dx,dy);player.x=clamp(player.x+dx/len*player.speed*dt,250,WORLD.w-250);player.y=clamp(player.y+dy/len*player.speed*dt,250,WORLD.h-250);
  const n=nearestNPC(); if(n)statusEl.textContent="Podés hablar con "+n.name;else statusEl.textContent="Explorando";
}
function render(){
  const vw=innerWidth/camera.scale,vh=innerHeight/camera.scale;
  camera.x+=(player.x-camera.x)*.14;camera.y+=(player.y-camera.y)*.14;
  const halfW=vw/2,halfH=vh/2;
  const cx=clamp(camera.x,halfW,WORLD.w-halfW),cy=clamp(camera.y,halfH,WORLD.h-halfH);
  world.style.transform="translate("+Math.round(innerWidth/2-cx*camera.scale)+"px,"+Math.round(innerHeight/2-cy*camera.scale)+"px) scale("+camera.scale+")";
  luna.style.left=player.x+"px";luna.style.top=player.y+"px";
}
function updateClock(dt){
  gameMinutes+=dt*2.5;
  if(gameMinutes>=24*60)gameMinutes-=24*60;
  const h=Math.floor(gameMinutes/60),m=Math.floor(gameMinutes%60);
  clockEl.textContent=String(h).padStart(2,"0")+":"+String(m).padStart(2,"0");
  const night=h<6||h>=21;
  document.getElementById("vignette").style.background=night?"radial-gradient(circle,transparent 38%,rgba(14,21,31,.48))":"radial-gradient(circle,transparent 45%,rgba(25,22,18,.18))";
}
function loop(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  movePlayer(dt);updateNPCs(dt);updateClock(dt);render();requestAnimationFrame(loop);
}
addEventListener("keydown",e=>{keys.add(e.key);if(e.key===" "){const n=nearestNPC();if(n)talk(n)}});
addEventListener("keyup",e=>keys.delete(e.key));
document.querySelectorAll("#touch button[data-key]").forEach(b=>{
  const k=b.dataset.key;
  b.addEventListener("pointerdown",()=>keys.add(k));b.addEventListener("pointerup",()=>keys.delete(k));b.addEventListener("pointercancel",()=>keys.delete(k));
});
addEventListener("resize",render);
render();requestAnimationFrame(loop);
</script>
</body>
</html>
